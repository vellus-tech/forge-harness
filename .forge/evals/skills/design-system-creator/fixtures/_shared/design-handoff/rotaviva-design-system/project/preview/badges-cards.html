<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
.badge{font-size:var(--fs-12);padding:var(--s-1) var(--s-2);border-radius:var(--r-pill)}
.badge.success{background:#E6F4EA;color:var(--success)}.badge.warning{background:#FFF4E0;color:var(--warning)}.badge.neutral{background:var(--n-100);color:var(--n-700)}
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-1);padding:var(--s-6)}
.eyebrow{font-family:var(--font-ui);font-size:var(--fs-12);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-muted)}
</style></head><body>
<span class="badge success">Aprovada</span><span class="badge warning">Pendente</span><span class="badge neutral">Expirada</span>
<div class="card"><span class="eyebrow">Saldo do passe</span><p>R$ 42,80</p></div>
</body></html>

openapi: 3.0.3
info:
  title: tarifa-service
  version: 0.2.0
paths:
  /v1/tarifas/{linhaId}:
    get:
      summary: Consulta a tarifa vigente da linha
      parameters:
        - name: linhaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Tarifa vigente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tarifa"
        "404":
          description: Linha sem tarifa cadastrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
  /v1/tarifas/{linhaId}/reajustes:
    post:
      summary: Aplica um reajuste percentual à tarifa vigente da linha (REQ-004)
      parameters:
        - name: linhaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReajusteRequest"
      responses:
        "200":
          description: Reajuste aplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReajusteResponse"
        "404":
          description: Linha sem tarifa cadastrada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "422":
          description: Percentual fora da faixa permitida (1 a 5000 bp)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
components:
  schemas:
    Tarifa:
      type: object
      required: [linhaId, valorCentavos]
      properties:
        linhaId:
          type: string
          format: uuid
        valorCentavos:
          type: integer
          format: int64
    ReajusteRequest:
      type: object
      required: [percentualBp]
      properties:
        percentualBp:
          type: integer
          format: int32
          minimum: 1
          maximum: 5000
          description: Percentual de reajuste em pontos-base (1 bp = 0,01%).
    ReajusteResponse:
      type: object
      required: [linhaId, valorAnteriorCentavos, valorNovoCentavos]
      properties:
        linhaId:
          type: string
          format: uuid
        valorAnteriorCentavos:
          type: integer
          format: int64
        valorNovoCentavos:
          type: integer
          format: int64
    ProblemDetails:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }

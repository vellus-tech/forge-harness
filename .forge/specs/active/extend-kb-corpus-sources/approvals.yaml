    reason: "3ª iteração com pendência — escalado ao humano conforme teto de revisão. Análise da rodada 3, conferida contra kb-corpus.mjs e com reprodução empírica em diretório descartável, não pela prosa do design. O que fechou: sintaxe do glob agora tem uma definição só (o passo 1 da validação remete a ela; a descrição do schema a parafraseia em prosa, não ipsis verbis como o texto afirma, mas a semântica bate); extensão do sufixo restrita a md, yaml e yml; a regex sozinha aceita ponto-barra-dois-asteriscos, mas a regra separada de segmento ponto ou ponto-ponto o rejeita e está declarada com clareza; o confinamento por relative e isAbsolute rejeita o irmão docRoot-x; countKinds compartilhada; pontuação final removida no madrStatus; paragrafo 5 registra o rebuild único; manifest com w313 e w318. PENDÊNCIA REAL, mesmo mecanismo da rodada 2 (validação do prefixo) e mesmo invariante então exigido (nenhum arquivo extra-path dentro de .forge/liaison nem das raízes já coletadas): as regras estruturais (segmento ponto, prefixo .forge) são aplicadas à string crua do config, e o confinamento ao caminho resolvido por realpath; os dois nunca se cruzam. Reproduzido: (a) docs/lnk como symlink para .forge/liaison, com docs/lnk/** no config e na allowlist, passa no texto (prefixo docs/lnk) e no confinamento (relative dá .forge/liaison, não começa por ponto-ponto), e readdirSync segue o symlink da raiz do walk, indexando blobs de peer; (b) docs/root como symlink para .. dá relative vazio, passa, e walk da raiz do projeto indexa tudo, inclusive .forge/liaison, que é o caso dois-asteriscos isolado que o REQ-02 critério 3 proíbe; (c) em macOS com FS case-insensitive, .FORGE/liaison/** passa na regra textual, e o realpath JS preserva a caixa (só o realpath native devolve .forge/liaison), e o design não diz qual dos dois usar. Exploração exige configuração deliberada mais symlink commitado, mas a régua da rodada 2 tratou config deliberada com allowlist alcançando conteúdo de peer como bloqueante, e o texto afirma fechar o caso por construção. Causa raiz sugerida para o humano decidir: aplicar todas as regras estruturais sobre o relative canônico (realpathSync.native dos dois lados), rejeitando relative vazio, igual a .forge ou iniciado por .forge/, e sobreposição em qualquer direção com as raízes nativas; mais testes negativos no w309 para symlink e caixa. Nota não bloqueante: o design afirma que proibir .forge fecha toda colisão de id com raízes já coletadas, mas docs/plans fica fora de .forge; docs/** ou docs/plans/** duplicaria cada plano sob plan e extra-path (resultado repetido e peso dobrado no ranking, e lookup por id pega o primeiro kind); sem vazamento de segurança, mas contradiz o invariante cada id com um único kind e a própria prosa, e a correção acima por sobreposição com raízes nativas resolve junto."

# redis-primary.conf — cache de leitura do saldo da carteira + fila de validações das catracas
# Ver outputs/resposta.md para o raciocínio completo (ADR-0003 e data-governance.md do projeto)

appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save 900 1
save 300 10
save 60 10000

repl-backlog-size 32mb
repl-diskless-sync yes
repl-diskless-sync-delay 5
repl-timeout 60

maxmemory 4gb
maxmemory-policy noeviction

requirepass <senha-forte-via-secret-manager>
protected-mode yes
bind 127.0.0.1 <ip-privado-do-no>

latency-monitor-threshold 100
slowlog-log-slower-than 10000

    reason: "Iteração 2, régua da rodada 1, conferida contra o código e não pelo resumo do builder. As 7 correções conferem no texto: forge.yaml em .forge/forge.yaml (budget-preflight.mjs:56 e validate-rules.mjs:38 confirmados); cmdBuild descrito como é (kb-cli.mjs:215-219 só imprime total e pulados); INDEX_FORMAT 3 em kb-lexical.mjs:17 sobe para 4, e indexState (kb-cli.mjs:86) trata formato diferente como defasado e loadIndex reconstrói, e w310 compara simbolicamente, sem quebra; madrStatus pega só o primeiro termo, o que casa accepted com sufixo e Superseded by ADR; campo JSON fixado como status; manifest preenchido. Mas a correção 6 (sintaxe do glob) ficou pela metade e abriu um buraco, e a revisão expôs um furo de confinamento que a rodada 1 não viu. Bloqueantes, cada um com o invariante que a correção precisa satisfazer. (1) §2.2 Validação passo 1 ainda prescreve a sintaxe antiga (prefixo seguido só de barra-dois-asteriscos), contradizendo a linha 46; implementado na ordem de validação, docs/adr/**/*.md (REQ-02 critério 5) é rejeitado. A description do schema também ainda diz só prefixo/**. Invariante: uma única definição de sintaxe, citada por referência no passo 1 e no schema. (2) Novo, introduzido pela correção 6: a extensão em /**/*.ext aceita qualquer alfanumérico, então *.pem, *.env, *.jsonl passam, contrariando REQ-02 (indexar arquivos .md/.yaml/.yml) e a mitigação do §6 (filtro de extensão). Invariante: nenhum documento extra-path tem extensão fora de md, yaml, yml; restringir ext a esse conjunto. (3) Pré-existente e não visto na rodada 1: o prefixo não é normalizado nem restrito. ./** passa nas três validações (sem .., não absoluto, realpath igual a docRoot) e equivale a ** isolado, que REQ-02 critério 3 manda rejeitar mesmo com allowlist. .forge/liaison/** passa e indexa blobs de peer, que são .md (187 neste repositório em .forge/liaison/forge-harness/blobs), e com o item 2 até .forge/liaison/**/*.jsonl indexa logs de peer, quebrando o invariante de procedência que REQ-01 e o Fora de escopo preservam (peer nunca indexado; a allowlist autoriza escopo, não contorna a validação estrutural). Prefixos sob raízes nativas (.forge/product/current, .forge/specs) duplicam ids com outro kind, e o §2.4 resolve kind e status por id. Invariantes: prefixo normalizado (posix normalize) não vazio e diferente de ponto; nenhum arquivo extra-path dentro de .forge/liaison, .forge/kb ou das raízes já coletadas nativamente; cada id no índice com um único kind. Com teste negativo para cada caso no w309. (4) §2.2 passo 3 diz que o realpath do prefixo precisa começar por docRoot resolvido; como comparação de string, um diretório irmão docRoot-x passa. Invariante: relative(realpath(docRoot), realpath(prefixo)) não começa com .. nem é absoluto (ou comparação com docRoot mais separador), com docRoot também resolvido por realpath. Ajustes não bloqueantes: §2.3 dizer que o build usa a mesma função de contagem do status, incluindo extra-path=0 forçado quando configurado (REQ-04 critério 3); §5 registrar o bump de INDEX_FORMAT como causa de rebuild único pós-upgrade; affected_paths sem tests/w313 e w318, que §7 diz estender; madrStatus remover pontuação final do termo (superseded, com vírgula não rotularia)."

# Spec delta — add-liaison-handoff-baton. Payloads preenchidos na fase verify (§2.5).
# Todas as ops são add_requirement: numeração continua de REQ-FHT-086 (máximo do baseline era 085
# no momento do rebase final desta branch sobre origin/develop).
operations:
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-086
    content_ref: requirements.md#req-01
    requirement:
      id: REQ-FHT-086
      title: "Forma da mensagem de bastão"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-086-A
          given: "um canal liaison aberto, com uma thread conhecida e um verbo `baton` qualquer sendo gravado"
          when: "a mensagem de bastão é montada e validada em duas camadas (envelope — schema + validateEnvelope — e bastão — validateBaton)"
          then: "ela é gravada como `kind: note`, `requires_ack: false`, `subject` derivado da oferta, `in_reply_to` igual ao `baton_id` (exceto na própria oferta, onde é null), e um objeto `baton` com `op`/`session`/`stamped_at` mais os subcampos específicos da operação; o objeto `baton` entra no `content_sha`; os seis valores de `op`, os quatro estados e os vereditos vêm de uma única fonte de código"
        - id: SCN-FHT-086-B
          given: "um participante com versão anterior a este change (schema sem `baton`) ou um `op` desconhecido de uma versão futura do harness"
          when: "a mensagem é importada por qualquer uma das duas réplicas"
          then: "a camada de envelope aceita a mensagem sem conflito nem buraco de `seq` (tolerante a `op` desconhecido), e a dobra classifica o `op` desconhecido como `malformed`, nunca recusando o import"
      contracts:
        - template/.forge/schemas/liaison-message.schema.json
        - template/.forge/scripts/lib/liaison-baton.mjs
      tests:
        - tests/w330-liaison-baton-envelope-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-087
    content_ref: requirements.md#req-02
    requirement:
      id: REQ-FHT-087
      title: "Oferta (`baton offer`)"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-087-A
          given: "um canal aberto com uma thread cujos participantes incluem ao menos um repositório além do próprio"
          when: "o operador roda `baton offer <channel> --thread <id> --subject \"<txt>\" [--body|--body-file|--from-handoff] [--for <a,b>] [--max-lease <s>] [--session <id>]`"
          then: "grava uma oferta no log próprio com `eligible` igual a `--for` ou a todos os participantes da thread, imprime o `baton_id`, e nenhuma sessão passa a deter o bastão — `baton status` mostra `available` sem titular"
        - id: SCN-FHT-087-B
          given: "uma thread cujos participantes não incluem nenhum repositório além do próprio, ou um `--for` que cita alguém fora da thread, ou um `eligible` resultante sem nenhum repositório além do próprio"
          when: "o operador roda `baton offer`"
          then: "recusa com rc 1 sem gravar nada, nomeando o motivo (coordenação só dentro do repositório não é material de liaison)"
      contracts: []
      tests:
        - tests/w333-liaison-baton-claim-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-088
    content_ref: requirements.md#req-03
    requirement:
      id: REQ-FHT-088
      title: "Reivindicação com compare-and-set local (`baton claim`)"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-088-A
          given: "uma oferta conhecida na réplica e uma sessão que roda `baton claim <channel> <baton_id> [--lease <s>] [--session <id>]`"
          when: "o pedido passa as pré-condições (oferta conhecida, `--lease` dentro dos limites, sessão ainda não titular com lease vigente)"
          then: "grava a reivindicação sob a trava exclusiva do log próprio, recalcula a dobra com ela incluída, e responde com o veredito: rc 0 se `won` (com `provisional`/`stable`), rc 3 em qualquer outro veredito nomeando a titular corrente"
        - id: SCN-FHT-088-B
          given: "10 processos `claim` disparados juntos para o mesmo bastão, de 10 sessões diferentes, no mesmo clone"
          when: "todos correm concorrentemente"
          then: "exatamente um recebe rc 0, os outros nove recebem rc 3 nomeando o mesmo vencedor, as dez mensagens ficam no log com `seq` contíguo sem buraco, e `baton status` concorda com o rc 0"
      contracts: []
      tests:
        - tests/w333-liaison-baton-claim-gate.sh
        - tests/w334-liaison-baton-cache-local-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-089
    content_ref: requirements.md#req-04
    requirement:
      id: REQ-FHT-089
      title: "Resolução determinística (dobra)"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-089-A
          given: "o conjunto de mensagens de bastão de uma thread, em qualquer ordem de importação entre réplicas"
          when: "o estado de um bastão é consultado por qualquer comando"
          then: "obtê-lo de uma única função pura que recebe as mensagens do canal, dobra cada thread em separado e aplica as operações de bastão na ordem da thread, usando só dados gravados nas mensagens (carimbos, prazos, folga e elegíveis da oferta), nunca o relógio nem a configuração local de quem lê"
      contracts:
        - template/.forge/scripts/lib/liaison-baton.mjs
      tests:
        - tests/w331-liaison-baton-fold-gate.sh
        - tests/w325-liaison-sender-order-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-090
    content_ref: requirements.md#req-05
    requirement:
      id: REQ-FHT-090
      title: "Provisório e estável entre réplicas"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-090-A
          given: "uma reivindicação vencedora sobre uma oferta cujo `eligible` cita três repositórios, antes de a réplica importar as mensagens posteriores dos outros dois"
          when: "a dobra declara uma sessão titular como dona"
          then: "marcar a posse como `stable` se, para todo repositório do conjunto exigido, a réplica contém o log desse repositório com `seq` contíguo desde 1 até alguma mensagem dele na thread com `lamport` maior ou igual ao da reivindicação, e como `provisional` caso contrário, nomeando os repositórios ainda não observados"
        - id: SCN-FHT-090-B
          given: "uma sessão que recebeu rc 0 `provisional` e, depois de um `sync`, perde para uma reivindicação concorrente que a precede na ordem da thread"
          when: "`baton status` ou o início de sessão são consultados"
          then: "mostram a perda tardia nomeando o vencedor, numa fixture com duas réplicas"
      contracts: []
      tests:
        - tests/w331-liaison-baton-fold-gate.sh
        - tests/w336-liaison-baton-status-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-091
    content_ref: requirements.md#req-06
    requirement:
      id: REQ-FHT-091
      title: "Lease: prazo, limites, folga e expiração"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-091-A
          given: "uma reivindicação ou renovação sendo gravada, com `liaison.baton.default_lease_seconds`/`max_lease_seconds`/`skew_tolerance_seconds` configurados ou nos defaults do template"
          when: "a operação é gravada"
          then: "carimbar `stamped_at` com o relógio de quem grava e `lease_until = stamped_at + lease_seconds`; quando o lease vence sem renovação, a titular corrente perde o direito de renovar mas continua titular até liberar, concluir ou ser substituída, e outras sessões elegíveis só tomam o bastão com reivindicação carimbada a partir de `lease_until + skew_tolerance_seconds`"
        - id: SCN-FHT-091-B
          given: "uma chave de `liaison.baton` fora de faixa (`default` < 60, `max` > 86400, `default` > `max`, folga negativa ou > 3600)"
          when: "`offer` ou `claim` leem a configuração"
          then: "recusam com rc 1 nomeando a chave; `renew`/`release`/`complete`/`withdraw`/`status`/`list`, o `liaison-ops.sh status`, o `render`, o início de sessão e a dobra não leem a configuração e não são afetados"
      contracts:
        - template/.forge/forge.yaml
      tests:
        - tests/w332-liaison-baton-config-gate.sh
        - tests/w331-liaison-baton-fold-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-092
    content_ref: requirements.md#req-07
    requirement:
      id: REQ-FHT-092
      title: "Renovação, liberação, conclusão e retirada"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-092-A
          given: "um bastão `held`, com a titular corrente rodando `baton renew`/`release`/`complete`, ou uma sessão do repositório ofertante rodando `baton withdraw`"
          when: "a dobra local, no momento da gravação, considera a operação válida"
          then: "grava sob a trava do REQ-09 e aplica o efeito (novo `lease_until`; `available` sem titular; `completed` terminal; `withdrawn` terminal, respectivamente)"
        - id: SCN-FHT-092-B
          given: "a mesma operação, mas com a dobra local considerando-a inválida no momento (sessão não é titular, lease ainda vigente para `withdraw`, etc.)"
          when: "o comando roda"
          then: "recusa sem gravar, nomeando o motivo e a titular corrente quando houver: rc 1 para `release`/`complete`/`withdraw`; para `renew`, o código de saída do SCN-FHT-092-C"
        - id: SCN-FHT-092-C
          given: "uma sessão rodando `baton renew` (manual, ou o gancho de renovação automática com `FORGE_BATON_RENEW_IF_DUE=1`)"
          when: "o renew é recusado"
          then: "o código de saída distingue o motivo: rc 4 para perda real (não é a titular corrente, ou o lease venceu, e a retomada é `baton claim`), rc 5 para ainda não é hora (só com `FORGE_BATON_RENEW_IF_DUE=1`, antes da metade do prazo) e rc 1 para erro ou transitório (trava ocupada ou perdida, oferta desconhecida, argumento inválido); o gancho só trata como perda o rc 4"
      contracts: []
      tests:
        - tests/w335-liaison-baton-lifecycle-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-093
    content_ref: requirements.md#req-08
    requirement:
      id: REQ-FHT-093
      title: "Auditoria e consulta (`baton status`, `baton list`)"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-093-A
          given: "um canal com bastões em estados variados (`available`, `held` provisório e estável, `completed`, `withdrawn`) e histórico de operações, incluindo vereditos de disputa"
          when: "o operador roda `baton status <channel> [<baton_id>] [--json]` ou `baton list <channel> [--json]`"
          then: "mostra por bastão o estado, a titular corrente, `lease_until`, a marca `provisional`/`stable`, o rótulo `expired` quando aplicável e o histórico completo (`msg_id`, `sender`, `session`, `op`, `stamped_at`, veredito, motivo); `list` mostra só os não terminais, um por linha; texto de peer sempre sob `untrusted-render`, nunca o corpo"
      contracts: []
      tests:
        - tests/w336-liaison-baton-status-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-094
    content_ref: requirements.md#req-09
    requirement:
      id: REQ-FHT-094
      title: "Trava do log próprio para todo escritor"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-094-A
          given: "qualquer caminho que grava em `log/<self>.jsonl` (`send`, `ack`, `thread open/join`, `conflicts resolve`, os subcomandos `baton`, `send --via cross-session`, a cópia de volta do push do `sync`)"
          when: "a gravação ocorre"
          then: "adquire uma trava exclusiva por `(canal, self)` resolvida no tronco, relê o log próprio, decide e grava dentro da trava, sem gravar a partir de uma leitura feita antes de adquiri-la; 20 `send` simultâneos produzem `seq` 1..20 sem buraco nem repetição"
        - id: SCN-FHT-094-B
          given: "uma trava cujo dono (pid/host) não existe mais no mesmo host, ou cuja idade passa de 120 s"
          when: "um novo escritor tenta adquirir a trava"
          then: "recupera a trava com aviso em stderr nomeando o dono antigo, de forma exclusiva e conferida por `nonce` (nunca duas recuperações simultâneas); a trava mora em `.forge/cache/`, nunca é transportada pelo `export`/`sync`"
      contracts: []
      tests:
        - tests/w326-liaison-own-log-lock-gate.sh
        - tests/w329-liaison-own-log-journal-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-095
    content_ref: requirements.md#req-10
    requirement:
      id: REQ-FHT-095
      title: "Identidade de sessão"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-095-A
          given: "um subcomando `baton` que grava ou decide por titularidade"
          when: "o comando roda com `--session <id>`, ou sem ela com `CLAUDE_CODE_SESSION_ID` no ambiente, ou sem nenhum dos dois"
          then: "obtém `session` de `--session` ou de `CLAUDE_CODE_SESSION_ID`; sem nenhum, recusa com rc 1 dizendo que agentes sem essa variável (Codex, Cursor, Gemini) devem passar `--session`; `session` fora do padrão `^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$` também recusa com rc 1"
        - id: SCN-FHT-095-B
          given: "duas sessões do mesmo repositório com identificadores diferentes disputando o mesmo bastão"
          when: "a dobra resolve titularidade"
          then: "são tratadas como titulares diferentes, nunca coalescidas pelo `sender`"
      contracts: []
      tests:
        - tests/w332-liaison-baton-config-gate.sh
        - tests/w324-liaison-baton-dependency-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-096
    content_ref: requirements.md#req-11
    requirement:
      id: REQ-FHT-096
      title: "Escritor único e compatibilidade com o canal existente"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-096-A
          given: "qualquer operação de bastão em execução"
          when: "a varredura estática e dinâmica dos caminhos de escrita dos subcomandos `baton` é aplicada"
          then: "escreve só no log próprio, `blobs/`, `CHANNEL.md` (pelo `render`), estado local não versionado e a trava — nenhuma escrita fora desse conjunto; `check-liaison-acks.sh` sobre um canal com todas as operações de bastão de três repositórios não acusa ack pendente novo nem violação de `trust`"
        - id: SCN-FHT-096-B
          given: "a suíte de gates do liaison já existente antes deste change (`w110`, `w111`, `w112`, `w113`, `w136`, `w140`, `w143`, `w150`, `w166`, `w167`, `w168`, `w169`, `w195`, `w198`, `w219`, `w220`, `w258`, `w259`, mais qualquer gate com `liaison` no nome)"
          when: "a troca do desempate (REQ-04) e da trava (REQ-09) é aplicada"
          then: "todos continuam verdes, e o conjunto recalculado por `ls tests/*liaison*-gate.sh` também fica verde"
      contracts: []
      tests:
        - tests/w330-liaison-baton-envelope-gate.sh
        - tests/w150-liaison-flag-and-trust-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-097
    content_ref: requirements.md#req-12
    requirement:
      id: REQ-FHT-097
      title: "Renovação automática enquanto a sessão está ativa"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-097-A
          given: "`liaison.auto` e `liaison.baton.auto_renew` ligados, e uma sessão do Claude Code que detém um bastão com lease ainda não vencido, restando menos da metade do prazo"
          when: "um evento `PostToolUse` da própria sessão ocorre"
          then: "renova o lease automaticamente pelo mesmo caminho do `baton renew`, no máximo uma vez por metade de prazo (conferido por 10 eventos concorrentes com exatamente uma renovação), terminando em ≤ 150 ms p95 nos caminhos sem bastão/fora da hora, com `sync --push-only` desacoplado do evento quando há transporte e participante externo"
        - id: SCN-FHT-097-B
          given: "uma sessão parada (sem eventos `PostToolUse`) que detém um bastão"
          when: "o lease dela vence"
          then: "nenhuma renovação ocorre, e o bastão fica disponível para tomada por outra sessão elegível após a folga"
      contracts:
        - template/.forge/scripts/lib/sync-adapters.mjs
      tests:
        - tests/w338-liaison-baton-auto-renew-gate.sh
        - tests/w339-liaison-baton-publish-result-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-098
    content_ref: requirements.md#req-13
    requirement:
      id: REQ-FHT-098
      title: "Bastão no início de sessão"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-098-A
          given: "uma sessão começando com `liaison.auto` ligado, num repositório com ofertas disponíveis, bastões detidos e perdas tardias ainda não exibidas"
          when: "`on-session-start.sh` roda"
          then: "acrescenta ao bloco do liaison as ofertas elegíveis, os bastões detidos por sessões deste repositório (sessão, `lease_until`, `provisional`/`stable`, `expired`) e as perdas tardias ainda não exibidas, com `baton_id` e assunto sob `untrusted-render`, nunca o corpo; bastão detido por outra sessão deste repositório mostra a nota de liberação/espera; falha do cálculo aparece como linha nomeando o erro; sem nenhum bastão, nenhuma linha nova"
      contracts: []
      tests:
        - tests/w340-liaison-baton-session-start-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-099
    content_ref: requirements.md#req-14
    requirement:
      id: REQ-FHT-099
      title: "Oferta a partir do `/forge:handoff`"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-099-A
          given: "uma árvore de trabalho com ou sem `.forge/HANDOFF.md` já gerado"
          when: "o operador roda `baton offer ... --from-handoff`"
          then: "usa como corpo da oferta o `HANDOFF.md` da árvore corrente (gerado na hora via `handoff-gen.sh` se ausente), gravado como blob com a mesma varredura de segredo e o mesmo teto de 64 KB do `--body-file`, tudo antes de adquirir a trava; `--from-handoff` junto de `--body`/`--body-file`, achado de segredo, acima de 64 KB ou falha de geração recusam com rc 1 sem gravar nada"
      contracts: []
      tests:
        - tests/w341-liaison-baton-handoff-gate.sh
        - tests/w60-handoff-gen-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-100
    content_ref: requirements.md#req-15
    requirement:
      id: REQ-FHT-100
      title: "Campainha opcional"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-100-A
          given: "uma oferta, liberação ou conclusão de bastão publicada no canal"
          when: "o operador usa o `notify` de `add-liaison-native-bridge` com o ponteiro `liaison:<channel>/<msg_id>` da mensagem de bastão"
          then: "o gancho de saída daquele change aceita o ponteiro normalmente (o `baton_id` é um `msg_id` próprio); o fluxo completo (oferta, duas reivindicações concorrentes, renovação, liberação, nova reivindicação, conclusão) entre duas réplicas dá o mesmo resultado com ou sem `notify`; nenhum script ou gancho deste change envia mensagem nativa entre sessões por conta própria, e a checagem do gate `w113` continua verde sobre os arquivos novos"
      contracts: []
      tests:
        - tests/w337-liaison-baton-e2e-gate.sh
        - tests/w113-liaison-enforce-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-101
    content_ref: requirements.md#req-16
    requirement:
      id: REQ-FHT-101
      title: "Norma e documentação"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-101-A
          given: "o change entregue, com todos os verbos `baton` implementados"
          when: "a documentação é conferida"
          then: "a rule `liaison-protocol.md` tem a seção do bastão com os tópicos do REQ-16 (quando usar/não usar, as seis operações, dobra/ordem/desempate, `provisional`/`stable`, lease/folga/carimbo como exceção declarada, identidade autodeclarada, renovação automática como exceção ao item 5 da rule), o `/forge:liaison` documenta o subcomando `baton` e seus oito verbos com as flags de `BATON_VERB_FLAGS`, o `/forge:handoff` tem a nota do REQ-14, `docs/refer/slash-commands.md`, inventário de gates/scripts, `CHANGELOG.md` sob `[Unreleased]` e o badge de gates do `README.md` estão atualizados"
      contracts: []
      tests:
        - tests/w342-liaison-baton-docs-gate.sh

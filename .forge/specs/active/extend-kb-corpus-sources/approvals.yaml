    reason: "Série nova de revisão, iteração 1, autorizada pelo dono do produto após o teto da série anterior. Causa raiz da série anterior (rodada 3, escalada): as regras de segurança de kb.extra_paths eram checadas sobre o TEXTO do glob declarado, nunca sobre o caminho físico resolvido, e um symlink commitado escapava docRoot ou alcançava .forge/liaison sem contradizer nenhuma regra. Decisão do dono: aplicar a correção técnica proposta (toda regra de segurança sobre o caminho resolvido por realpathSync.native, mesmo padrão de SEC-001 e NODE-201), manter extra_paths no escopo e tratar a resubmissão como série nova. Análise própria, não pelo veredito do validador anterior: reli o design inteiro (seções 2.2, 6 e 7) e implementei a sequência das etapas 1 a 3 literalmente num diretório descartável, com fixtures reais. Rejeitados como o texto promete: ponto-barra-dois-asteriscos, dois-asteriscos isolado, .forge e .forge/liaison diretos, .FORGE/liaison em FS case-insensitive (o realpath native devolve .forge), sufixo inexistente sob .FORGE/LIAISON, symlink docs para .forge/liaison, symlink docs para a raiz via ponto-ponto (rel vazio), cadeia de dois symlinks até .forge (multi-hop resolvido), symlink em laço (ELOOP vira skip), ../x, docs/** e symlink para docs/plans (sobreposição com raiz nativa). Aceitos corretamente: docs/adr/** e docs/adr/**/*.md (critério 5 do REQ-02). Symlink pendente é aceito, mas o walk falha no readdir e nada é lido. Conferi no código que walk() usa Dirent com withFileTypes, então symlinks internos à árvore nunca são seguidos (isFile e isDirectory são falsos para link): só a raiz do walk segue link, e é exatamente ela que a etapa 2 resolve. Cross-device não altera o realpath. O furo de segurança da série anterior está fechado por construção, e a linha nova do quadro de riscos e os testes negativos do w309 o cobrem. Approve. Notas VINCULANTES para tasks.md e w309, que não reabrem o ciclo por serem consequência direta da correção no mesmo mecanismo e não permitirem leitura fora de docRoot: (1) ao trocar toda a lógica textual pela física, o design deixou de rejeitar texto absoluto e segmento ponto ou ponto-ponto; medido, /etc/** vira docRoot/etc pelo join por segmentos e é aceito, e docs/../docs/adr/** também, contrariando o critério 3 do REQ-02 (absoluto e ponto-ponto rejeitados mesmo com allowlist) e a própria descrição do schema, que já diz sem segmento ponto ou ponto-ponto. A etapa 1 (gramática) deve voltar a rejeitar texto absoluto e qualquer segmento ponto ou ponto-ponto, como defesa em profundidade, nunca em lugar da checagem física, com caso negativo no w309. (2) O walk tem de partir exatamente do caminho validado (join por segmentos a partir de docRoot), nunca de path.resolve do texto cru, para validação e leitura não divergirem. (3) A sobreposição com raízes nativas precisa valer nos dois sentidos: docs/plans/sub/** passa (só igual ou ancestral é checado) e duplica ids sob plan e extra-path; incluir descendente. (4) Na resolução do maior ancestral, só ENOENT conta como inexistente; outro erro vira skip. (5) Registrar no design ou no teste que symlink interno é ignorado pelo walk, com caso no w309 (symlink dentro de docs/adr apontando para .forge/liaison não indexa nada)."

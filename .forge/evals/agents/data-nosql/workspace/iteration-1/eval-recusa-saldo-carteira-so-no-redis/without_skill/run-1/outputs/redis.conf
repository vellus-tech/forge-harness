# redis.conf — cluster com réplica, se a decisão for seguir com Redis como storage único
# para saldo de carteira digital. Ver outputs/resposta.md para a ressalva completa sobre
# por que essa não é a arquitetura recomendada para dado financeiro.

appendonly yes
appendfsync always          # maior garantia possível no Redis, mas ainda não é ACID de banco
                             # transacional; também é o modo de MAIOR custo de latência do Redis
aof-use-rdb-preamble yes    # AOF compacto (RDB + comandos incrementais) para recovery mais rápido
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

save ""                     # desliga snapshot RDB periódico (redundante com AOF always;
                             # evita fork() custoso concorrendo com o AOF always)

repl-diskless-sync no       # replicação via disco: mais lento, mais seguro que diskless para
                             # não perder o RDB inicial de sync em caso de falha do link
repl-backlog-size 256mb     # backlog maior para resistir a desconexões curtas de réplica sem
                             # exigir full resync

maxmemory-policy noeviction # CRÍTICO: qualquer policy de eviction (allkeys-lru etc.) pode
                             # apagar saldo:* sob pressão de memória — em dado financeiro,
                             # eviction habilitada é bug de perda de dinheiro, não trade-off de
                             # performance

cluster-enabled yes
cluster-node-timeout 5000
cluster-require-full-coverage yes   # recusa escrita em slot sem cobertura, em vez de aceitar
                                     # escrita parcial silenciosa

# Fora deste arquivo: configure fencing no orquestrador de failover (Sentinel/operator) para que
# o primário antigo, se voltar após split-brain, nunca aceite escrita antes de sincronizar com o
# novo primário.

spring:
  application:
    name: pagamentos-api
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: 5671
    ssl:
      enabled: true
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 20

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagamentos-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pagamentos-api
  template:
    metadata:
      labels:
        app: pagamentos-api
    spec:
      containers:
        - name: api
          image: registry.example.invalid/pagamentos-api:latest
          securityContext:
            privileged: true

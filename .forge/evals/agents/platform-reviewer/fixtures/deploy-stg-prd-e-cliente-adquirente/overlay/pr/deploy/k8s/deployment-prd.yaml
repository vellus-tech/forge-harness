apiVersion: apps/v1
kind: Deployment
metadata:
  name: validacao
  namespace: prd-validacao
spec:
  replicas: 3
  selector:
    matchLabels:
      app: validacao
  template:
    metadata:
      labels:
        app: validacao
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      containers:
        - name: validacao
          image: 123456789012.dkr.ecr.sa-east-1.amazonaws.com/validacao:1.8.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080

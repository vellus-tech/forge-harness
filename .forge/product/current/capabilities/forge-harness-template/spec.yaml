        given: "um projeto com .forge/ instalado e outro sem .forge/"
        when: "o usuário roda npx forge-harness update (ou node bin/forge.mjs update), com ou sem --target/--source"
        then: "no projeto com .forge/ a maquinaria é atualizada preservando os dados do projeto e o relatório final lista o que foi atualizado, o que foi preservado e onde ficou o backup; sem .forge/ falha com exit 3 sugerindo init, sem alterar nada"
    tests:
      - tests/w63-forge-update-gate.sh
  - id: REQ-FHT-038
    title: "Overlay aditivo da maquinaria, sem deleção"
    normative: "SHALL"
    scenarios:
      - id: SCN-FHT-038-A
        given: "um projeto com um arquivo de maquinaria alterado no template novo, um arquivo extra (órfão) criado pelo projeto dentro de um diretório de maquinaria, e adapters/*.lock.yaml presentes"
        when: "o update roda"
        then: "agents/, commands/, hooks/, schemas/, scripts/, skills/, templates/, rules/, adapters/*.yaml e o README.md do .forge/ são sobrescritos com o template novo, arquivos novos são adicionados, o órfão do projeto é preservado (nada é deletado) e os adapters/*.lock.yaml não são sobrescritos pelo overlay"
    tests:
      - tests/w63-forge-update-gate.sh
  - id: REQ-FHT-039
    title: "Preservação integral dos dados do projeto no update"
    normative: "SHALL"
    scenarios:
      - id: SCN-FHT-039-A
        given: "um projeto com uma spec, um ADR, runners.yaml com enabled: true, constitution.md, context.md e FORGE.md preenchidos"
        when: "o update roda"
        then: "specs/active, specs/archived, product/current, product/published, custom/, evals/ (conteúdo), runners.yaml, FORGE.md, constitution.md e context.md permanecem byte-idênticos ao estado anterior"
    tests:
      - tests/w63-forge-update-gate.sh
      - tests/npx-pack-gate.sh
  - id: REQ-FHT-040
    title: "Merge campo-a-campo do forge.yaml no update"
    normative: "SHALL"
    scenarios:
      - id: SCN-FHT-040-A
        given: "um forge.yaml com adapters ativos e flags do projeto, e uma versão de pacote mais nova"
        when: "o update roda"
        then: "apenas harness.template_version é atualizado para a versão do pacote; a lista de adapters ativos e todas as demais chaves permanecem idênticas"
    tests:
      - tests/w63-forge-update-gate.sh
  - id: REQ-FHT-041
    title: "Reconciliação de adapters e ambiente ao fim do overlay"
    normative: "SHALL"
    scenarios:
      - id: SCN-FHT-041-A
        given: "um projeto com adapter claude ativo, hooksPath desconfigurado e bloco managed do .gitignore desatualizado, rodando com e sem --no-plugin"
        when: "o overlay do update termina"
        then: "sync-adapters --adapter all roda preservando a lista ativa (.claude, AGENTS.md e lockfiles regenerados sem drift, doctor limpo), o core.hooksPath e o bloco managed do .gitignore são reconciliados, e o plugin global só é re-materializado quando claude está ativo e --no-plugin não foi passado"
    tests:
      - tests/w63-forge-update-gate.sh
  - id: REQ-FHT-042
    title: "--dry-run e backup automático no update"
    normative: "SHALL"
    scenarios:
      - id: SCN-FHT-042-A
        given: "um projeto prestes a receber o update, com e sem a flag --no-backup"
        when: "o usuário roda update --dry-run e, depois, o update real"
        then: "o --dry-run lista os paths que mudariam sem escrever nada em disco (exit 0); o update real cria .forge.bak-N por padrão e não cria backup algum sob --no-backup"
    tests:
      - tests/w63-forge-update-gate.sh
  - id: REQ-FHT-043
    title: "Slash /forge:upgrade distinto de /forge:update"
    normative: "SHALL"
    scenarios:
      - id: SCN-FHT-043-A
        given: "o comando template/.forge/commands/harness/upgrade.md com frontmatter válido"
        when: "o usuário roda /forge:upgrade no agente e o plugin é reconstruído"
        then: "o comando dispara o update do CLI mostrando o --dry-run antes de aplicar, sem colidir com /forge:update (grafo), e o plugin-sync-gate passa com a contagem de comandos incrementada"
    tests:
      - tests/plugin-sync-gate.sh
  - id: REQ-FHT-044
    title: "Doctor não acusa falso-positivo em specs, worktrees, product, evals e custom"
    normative: "SHALL NOT"
    scenarios:
      - id: SCN-FHT-044-A
        given: "um projeto com uma spec citando \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\".claude/\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" no texto e um placeholder <PROJECT_ID> dentro de worktrees/**"
        when: "o doctor varre a fonte canônica"
        then: "não reporta vazamento de refs .claude/ nem placeholder órfão, porque specs/, worktrees/, product/, evals/ e custom/ são excluídos dessas checagens — as demais checagens do doctor seguem valendo"
    tests:
      - tests/w63-forge-update-gate.sh
  - id: REQ-FHT-045
    title: "Idempotência do update e cobertura pelo tarball empacotado"
    normative: "SHALL"
    scenarios:
      - id: SCN-FHT-045-A
        given: "um projeto já atualizado, sem mudança de versão do pacote, e o tarball npm empacotado"
        when: "o update roda uma segunda vez, e a seção 6 do npx-pack-gate executa init+update a partir do tarball"
        then: "a segunda execução é no-op (working tree inalterada), e o fluxo pelo tarball preserva o produto do projeto enquanto atualiza a maquinaria, com o doctor limpo ao final"
    tests:
      - tests/w63-forge-update-gate.sh
      - tests/npx-pack-gate.sh
  - id: REQ-FHT-046
    title: "core.hooksPath customizado nunca é sobrescrito por init/update/install.sh"
    normative: "SHALL NOT"
    scenarios:
      - id: SCN-FHT-046-A
        given: "um repositório com core.hooksPath customizado para outro valor (ex.: .githooks), configurado pelo próprio projeto e não pelo Forge"
        when: "forge init --force, forge update ou installer/install.sh roda nesse repositório"
        then: "o valor customizado é preservado e uma nota informativa explica que os hooks do Forge (pre-push de docs, pre-commit de worktree) não estão ativos por causa do hooksPath customizado, com a orientação de encadeá-los ou trocar manualmente"
      - id: SCN-FHT-046-B
        given: "um repositório sem core.hooksPath configurado (default .git/hooks) e outro já com .forge/hooks/git"
        when: "init, update ou install.sh roda"
        then: "o repositório sem configuração recebe core.hooksPath = .forge/hooks/git (caminho feliz da instalação nova, sem regressão) e o que já apontava para .forge/hooks/git é no-op silencioso, sem emitir a nota de hooksPath customizado"
    tests:
      - tests/w94-hookspath-preserve-gate.sh
      - tests/w13-init-gate.sh
      - tests/w63-forge-update-gate.sh
  - id: REQ-FHT-047
    title: "Replay deriva base pré-correção mesmo quando teste e correção vêm no mesmo commit"
    normative: "SHALL"
    scenarios:
      - id: SCN-FHT-047-A
        given: "um repositório em que o commit que introduziu o caso declarado também toca os fix_files (squash), com um commit posterior tocando os mesmos arquivos por outro motivo e reescrevendo as linhas da correção"
        when: "o replay deriva a árvore base"
        then: "a estratégia ancestry é descartada (o commit posterior é ruído e sua base já contém a correção), revert-synthesis reverte o diff do commit do caso e, quando esse patch não aplica sobre o HEAD, a base passa a ser parent(caseCommit) com o test_path enxertado — gravada como base_strategy test-graft e graft_from, e nunca como uma afirmação de que o teste 'já passa na base'"
      - id: SCN-FHT-047-B
        given: "uma suíte cujos testes são gates shell, que reportam falha como \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"FAIL [n] (motivo)\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\", e um artefato com base_strategy test-graft"
        when: "a falha na base é classificada e o artefato validado"
        then: "a falha classifica como behavioral (não 'unknown', que a recusaria pelo item 3 da rule), enquanto prosa que apenas mencione o termo e o \\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\"FAIL (...)\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\\" sem índice dos validadores continuam não casando; e o validador do artefato aceita base_strategy test-graft com graft_from em formato de commit"
    contracts:
      - template/.forge/schemas/red-evidence.schema.json
    tests:
      - tests/w108-red-graft-gate.sh
      - tests/w107-red-replay-gate.sh
      - tests/w106-red-first-gate.sh
  - id: REQ-FHT-048
    title: "Plano de tasks sem metadados não passa pelos checks de grafo por vacuidade"
    normative: "SHALL"
    scenarios:
      - id: SCN-FHT-048-A
        given: "um tasks.md com duas ou mais tasks em que nenhuma linha declara campo de metadados reconhecido (rastreia/paths/depende/expõe, em qualquer grafia aceita pelo parser)"
        when: "checkTasksGraph roda sobre o plano"
        then: "emite TSK-06 bloqueante nomeando que TSK-01, TSK-02 e TSK-03 não verificaram nada e passaram por vacuidade; quando a omissão é apenas de parte das tasks, o mesmo código emite achado não-bloqueante nomeando as tasks sem bloco"
      - id: SCN-FHT-048-B
        given: "um plano cujas tasks declaram \\\\\\\\\\\\\\\"depende: —\\\\\\\\\\\\\\\" ou \\\\\\\\\\\\\\\"depende: nenhuma\\\\\\\\\\\\\\\", e um plano de uma única task sem metadados"
        when: "checkTasksGraph roda"
        then: "nenhum TSK-06 é emitido nos dois casos — declarar independência é diferente de não declarar nada, e um plano de uma task não tem aresta possível; TSK-01..05 seguem com os mesmos achados e a mesma classificação de antes"
    tests:
      - tests/w130-tasks-graph-gate.sh
  - id: REQ-FHT-049
    title: "Code graph trata bin/ como código-fonte e poda apenas a saída de build dentro dele"
    normative: "SHALL"
    scenarios:
      - id: SCN-FHT-049-A
        given: "um projeto Node cujo package.json declara \\\\\\\"bin\\\\\\\": {\\\\\\\"demo\\\\\\\": \\\\\\\"bin/cli.mjs\\\\\\\"}, com bin/cli.mjs importando src/run.mjs"
        when: "graph.sh build constrói o grafo"
        then: "bin/cli.mjs é nó do grafo e a aresta bin/cli.mjs → src/run.mjs existe resolvida — o entrypoint do CLI não desaparece em silêncio de /forge:impact, /forge:onboard e /forge:c4"
      - id: SCN-FHT-049-B
        given: "o mesmo projeto com bin/Debug/net8.0/Generated.cs (saída de compilação .NET, com extensão que casa LANG), além de dist/ e obj/"
        when: "graph.sh build constrói o grafo"
        then: "nenhum dos três entra no grafo — a poda de Debug/Release/x64/net* é contextual ao diretório pai chamado bin, e o restante de SKIP_DIRS segue inalterado"
    tests:
      - tests/w41-graph-gate.sh
  - id: REQ-FHT-050
    title: "A execução de referência do Red-first é a de um runner que o autor não controla"
    normative: "SHALL"
    scenarios:
      - id: SCN-FHT-050-A
        given: "um repositório com changes ativos de tipos variados, um deles type:bugfix com evidência de Red pendente"
        when: "red-evidence.sh ci roda (sem argumentos — o subcomando recusa change-id, para que o escopo venha do repositório e não de quem invoca)"
        then: "todo change type:bugfix é reexecutado via ensure e avaliado pelo check estático, a saída nomeia cada change com seu veredito, o exit é ≠0 porque um deles não tem Red observado, e changes de outros tipos não aparecem no relato nem afetam o resultado; repositório sem bugfix ativo sai 0"
      - id: SCN-FHT-050-B
        given: "um pull request num projeto com o harness instalado"
        when: "o workflow red-first.yml roda no runner, com fetch-depth: 0 e dependências instaladas antes"
        then: "o replay é reexecutado ali e o build reprova se o Red não for observado, independentemente do que o red-evidence.json commitado afirme; o workflow é materializado por init/update tanto pelo bin/forge.mjs quanto pelo installer/install.sh, e nunca sobrescreve um workflow já existente no projeto"
    tests:
      - tests/w109-red-ci-gate.sh

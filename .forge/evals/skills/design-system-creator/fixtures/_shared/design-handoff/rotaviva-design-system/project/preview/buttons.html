<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
.btn{font-family:var(--font-ui);font-size:var(--fs-16);padding:var(--s-3) var(--s-6);border-radius:var(--r-pill);border:0;transition:transform var(--dur-fast) var(--ease-out)}
.btn:active{transform:scale(0.96)}
.btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.primary{background:var(--brand);color:var(--n-0)}
.secondary{background:var(--brand-soft);color:var(--n-900)}
.ghost{background:transparent;color:var(--n-700)}
.danger{background:var(--danger);color:var(--n-0)}
.sm{padding:var(--s-2) var(--s-4);font-size:var(--fs-14)}
</style></head><body>
<button class="btn primary">Recarregar</button><button class="btn secondary">Ver extrato</button><button class="btn ghost">Cancelar</button><button class="btn danger">Bloquear cartão</button><button class="btn primary sm">Ok</button>
</body></html>

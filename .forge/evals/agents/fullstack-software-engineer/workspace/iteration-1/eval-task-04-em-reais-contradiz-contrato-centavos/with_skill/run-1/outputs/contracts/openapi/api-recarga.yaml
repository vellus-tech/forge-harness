openapi: 3.1.0
info:
  title: api-recarga
  version: 1.3.0
paths:
  /recargas:
    post:
      operationId: criarRecarga
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID gerado pelo cliente por tentativa de compra (DD-002). Chave repetida devolve a recarga já criada.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cartaoId, valorCentavos]
              properties:
                cartaoId: { type: string }
                valorCentavos:
                  type: integer
                  description: "Valor em centavos de BRL. Mínimo 100 (R$ 1,00), máximo 50000 (R$ 500,00)."
                  minimum: 100
                  maximum: 50000
      responses:
        "201":
          description: Recarga criada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recarga" }
        "200":
          description: Idempotency-Key já usada; devolve a recarga já criada nessa tentativa.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recarga" }
        "400": { $ref: "#/components/responses/Error" }
  /recargas/{cartaoId}:
    get:
      operationId: listRecargas
      parameters:
        - { name: cartaoId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200":
          description: Recargas do cartão, mais recentes primeiro.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Recarga" } }
        "400": { $ref: "#/components/responses/Error" }
components:
  responses:
    Error:
      description: Erro de validação ou de negócio.
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties: { code: { type: string }, message: { type: string } }
  schemas:
    Recarga:
      type: object
      required: [id, cartaoId, valorCentavos, status, criadaEm]
      properties:
        id: { type: string, format: uuid }
        cartaoId: { type: string }
        valorCentavos: { type: integer, description: "Valor em centavos de BRL." }
        status: { type: string, enum: [PENDENTE, CONFIRMADA, FALHOU] }
        criadaEm: { type: string, format: date-time }

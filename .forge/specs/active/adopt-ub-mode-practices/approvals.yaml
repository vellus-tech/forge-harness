 spike-result, ADR 0006 e design.md, com justificativa, já que o ternário é ponto de decisão na métrica de McCabe padrão. A decisão da ADR (sinal não bloqueante) não depende disso. Sem regressão: suíte do change PASS com 55 cenários, plugin-sync-gate PASS, tasks.md com 16 [X] e 0 [ ]/[-]/[!], Payments.DevPortal só com os não rastreados já existentes (.next/, next-env.d.ts, tsconfig.tsbuildinfo) e HEAD 35e63e23."

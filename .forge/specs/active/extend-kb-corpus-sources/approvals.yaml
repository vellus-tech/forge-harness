    autonomous: true
    reason: "Análise adversarial própria, conferida contra kb-corpus.mjs/kb-cli.mjs/kb-lexical.mjs, não pelo veredito das rodadas anteriores. As correções anteriores (§7 com NFR-01/NFR-02, §2.4 propagação via kb-lexical.mjs:113) conferem com o código. Quatro bloqueantes objetivos e derivados do código, e três ajustes. (1) BLOQUEANTE §2.2: readExtraPaths lê '<docRoot>/forge.yaml', mas a convenção do harness é '<root>/.forge/forge.yaml' (budget-preflight.mjs:56, plugin-build.mjs:106, validate-rules.mjs:38, validate-archive.mjs:87; não existe forge.yaml na raiz). Implementado literalmente, kb.extra_paths nunca é lido em projeto real e REQ-02 falha em silêncio (um fixture com o mesmo caminho errado passaria). Corrigir para join(docRoot, '.forge/forge.yaml'). (2) BLOQUEANTE §2.3: afirma que cmdStatus/cmdBuild já constroem kinds genericamente e que o único ajuste é forçar extra-path=0 no status. Falso para build: cmdBuild (kb-cli.mjs:215-219) imprime só total de documentos/trechos e 'pulados:', sem contagem por kind. REQ-04 critério 3 ('kb.sh build lista as mesmas chaves') fica sem design. Especificar a contagem por kind no build, de preferência em função compartilhada com cmdStatus, incluindo o extra-path=0 forçado. (3) BLOQUEANTE §2.4/§5: madr_status entra em idx.docs, mas INDEX_FORMAT continua 3 (kb-lexical.mjs:17) e fingerprint() só cobre (id, sha256). Um índice construído antes do upgrade, num projeto sem specs ativas nem extra_paths, é julgado 'atual' por indexState e nunca ganha madr_status, então os rótulos de REQ-07 não aparecem até alguma fonte mudar. Decidir o bump de INDEX_FORMAT para 4 (força rebuild) e registrar em §5. (4) BLOQUEANTE §2.4: a regex captura o resto da linha inteiro, e o design normaliza e mapeia por igualdade. Valores reais não casam: o baseline já tem 'accepted — gate design_reviewed aprovado...' e o MADR usa 'Superseded by [ADR-0012](...)'. Com igualdade, 'superseded by adr-0012' não vira superseded e não recebe rótulo, o que viola o critério 2 de REQ-07. Especificar a classificação pelo primeiro token (ou prefixo) após normalização, com PBT/casos para valor com sufixo. (5) §2.4 e §4: o nome do campo JSON está indeciso ('status (ou madr_status)'; REQ-07 diz 'status'). Fixar um nome único. A saída também precisa resolver kind/madr_status por id em idx.docs, porque o resultado de search() hoje só tem 'doc'; explicitar isso. (6) §2.2: a regex de sintaxe (prefixo sem asterisco terminando em /**) não rejeita '?' nem chaves, ao contrário do que o texto diz (são tratados como literais, o que é inofensivo, mas o texto deve dizer isso). REQ-02 critério 5 cita 'docs/adr/**/*.md', que a sintaxe do design rejeita. Alinhar o exemplo para 'docs/adr/**' ou declarar a forma aceita. Registrar também que walk() ignora symlinks internos (Dirent.isFile/isDirectory são falsos para link), o que, junto com realpath do prefixo, fecha o confinamento. (7) Nota: manifest.yaml ainda tem affected_capabilities/affected_paths vazios. A rodada de requirements pediu preenchê-los até o design (forge-harness-template; kb-corpus.mjs, kb-cli.mjs, kb-lexical.mjs, forge.schema.json, commands/graph/kb.md, w309/w313/w318)."

approvals:
  - gate: requirements_reviewed
    decision: approve
    autonomous: true
    reason: "Decisao do gate ESCALADO apos o limite de 3 iteraçoes do loop §14.6, com o humano delegando a decisao final ao yolo-gate; --iteration omitido porque approval-log.sh so aceita 1..3 e esta decisao nao e uma 4a iteraçao do loop, e sim o desfecho da escalaçao. Verificado por execucao, nao por leitura. Os dois snippets do §1 reproduzem exatamente (caso a: morre rc=1 mudo; caso b: segue e sai 0). Catalogo confere: grep bruto da 95 linhas = 52 asserçoes em 20 arquivos (a soma por arquivo fecha em 52) + 9 de controle-de-fluxo + 2 exceçoes + ~32 do idioma B; idioma A mede 713 em 40 arquivos, exato. Spot-check de 13 linhas citadas bate verbatim, incluindo o par corroborante w32-archive-gate.sh:87 (bare, quebrado) vs w90-run-manifest-gate.sh:67 (expressao identica, ja com o fallback || { FAIL }), que evidencia que a correçao e mecanica e o idioma-alvo ja e a norma da casa. Os dois pontos da 3a rodada estao genuinamente resolvidos: (i) reproduzi o Red do §5 — removendo billing.ts, w80-suite-gate.sh sai rc=1 sem emitir nenhum FAIL [2]; o teste proposto emite FAIL [1], que red-classify.mjs classifica como behavioral pela assinatura shell-gate, e o failure_pattern declarado casa; o teste vive em tests/, logo entra no --list do run-all; e red-replay usa revert-synthesis (reverte apenas fix_files num worktree efemero em HEAD), de modo que o teste permanece presente enquanto w80 volta ao estado bare — desenho compativel com o motor real. (ii) os numeros passam a ter lastro. Riscos novos da correçao final checados e descartados: run-all.sh e estritamente sequencial (sem & nem xargs -P), entao mutar a fixture nao cria corrida com o proprio w80; a fixture e rastreada no git, logo existe no worktree efemero; restauraçao por trap EXIT cobre sucesso e falha. Corrigi neste turno os dois unicos residuos, ambos nao-semanticos e derivados da minha propria mediçao: o §3 citava 511+ para o idioma A contra os 713 medidos no §1 (contradiçao interna entre seçoes) e a citaçao literal do regex do red-classify estava sem o \n na classe negada. Sem NEEDS CLARIFICATION pendente (so o boilerplate do template). As 6 seçoes sao testaveis e coerentes, o escopo e enumerado site a site com file:line e o §3 declara explicitamente o que nao muda. Ressalva nao-bloqueante registrada: proposal.md segue como boilerplate nao preenchido — validate-spec passa assim e o bugfix.md cobre motivaçao, escopo e rastreabilidade com rigor muito maior; e a pendencia declarada no §5 (gate que passe a reprovar durante a conversao) e deliberadamente deixada para investigaçao caso a caso na task, postura correta e nao ambiguidade nao resolvida."
    decided_by: "forge-yolo (opus, high)"
    decided_at: "2026-08-04T14:15:52-03:00"
    commit: "cb577f2"
    scope: "bugfix.md"

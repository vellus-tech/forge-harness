apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: objetos
spec:
  serviceName: objetos
  replicas: 1
  selector:
    matchLabels:
      app: objetos
  template:
    metadata:
      labels:
        app: objetos
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-04-08T15-41-24Z # fixar versão testada; "latest" não é reproduzível
          args: ["server", "/data"]
          ports:
            - containerPort: 9000
              name: api
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: dados
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 15
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: objetos
spec:
  clusterIP: None
  selector:
    app: objetos
  ports:
    - port: 9000
      targetPort: 9000
      name: api

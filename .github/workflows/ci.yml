name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  # A suíte roda fatiada em shards, cada um no seu runner (sem concorrência local entre gates: o
  # paralelismo é entre máquinas, nunca dentro de uma). `tests/run-all.sh --shard K/N` fica com o
  # gate cujo índice na lista ordenada do `--list` satisfaz índice mod N == K-1, e as suítes bats
  # ficam fixas no shard 1; a partição (união == lista completa, sem repetição) e a forma deste
  # arquivo são provadas pelo w273. Serial num runner só, a suíte chegou a ~27min (2026-10-03).
  suite:
    name: suite (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      # Sem fail-fast: um shard vermelho não pode cancelar os outros e esconder as reprovações
      # deles — o relatório de um PR tem de trazer TODAS as reprovações de uma vez.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # Teto POR SHARD. Sem ele o default do GitHub é 6 HORAS, e um passo que pendura segura a fila de
    # todos os PRs abertos sem nunca reportar falha — foi o que aconteceu quando o mirror apt do
    # runner engasgou: três runs parados quase uma hora no mesmo passo, todos in_progress, nenhum com
    # veredito. Um CI que não termina é pior que um CI que reprova.
    # Histórico do teto do job serial: 25min → 35min (2026-09-28, w239 sozinho levou 5,7min) →
    # 45min (2026-09-30, 166 gates em 33m41s). Fatiado em 3 e com `--skip-postcheck` nos gates que
    # chamam `forge update` dezenas de vezes sem testar o doctor, os shards mediram 1050s, 591s e
    # 686s numa máquina de desenvolvimento em 2026-10-03 (o shard 1 concentra w151, w214, w217, w250
    # e w253 pelo round-robin). Essa máquina é ~2,3x mais lenta que o runner (o w239 levou 775s nela
    # contra 332s no CI), então a estimativa NÃO MEDIDA para o shard 1 no runner é ~8min. 25min cobre
    # até o pior caso medido localmente com folga, sem mascarar um hang de verdade.
    timeout-minutes: 25
    steps:
      # fetch-depth: 0 é obrigatório — o motor deriva a árvore pré-correção do histórico
      # (ancestry, revert sintetizado ou enxerto do teste), e o w239 [12] mede as tags v*. Com o
      # checkout raso padrão não há histórico de onde derivar, e todo replay viraria `not-possible`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install bats
        timeout-minutes: 8
        run: |
          set -uo pipefail
          # O mirror apt deste runner engasga com frequência — medido: dez runs seguidos parados
          # neste passo, alguns por quase uma hora, antes de haver teto. Uma tentativa só, curta, e
          # queda imediata para o registry do npm, que já está quente por causa do `npm ci` logo
          # abaixo e não depende do mirror Ubuntu.
          #
          # A soma dos tetos internos (90 + 60 = 150s) tem de caber FOLGADA dentro do
          # `timeout-minutes` do passo: se ela estourar primeiro, o GitHub mata o passo inteiro e o
          # fallback nunca roda — o teto viraria só um jeito mais rápido de falhar. Foi o defeito
          # da primeira versão deste bloco (duas tentativas de até 300s = 600s contra um teto de
          # 480s).
          if timeout 90 sudo apt-get update -qq && timeout 60 sudo apt-get install -y -qq bats; then
            bats --version && exit 0
          fi
          echo "apt indisponível — instalando bats pelo npm"
          npm install -g bats && bats --version
      - name: Install ripgrep (w250 [7] — equivalência rg × grep dos scanners de dados)
        timeout-minutes: 8
        run: |
          set -uo pipefail
          # O w250 [7] só prova a equivalência dos dois motores do scan.sh com `rg` presente; sem ele o
          # cenário sai 127 (não verificado) e a suíte sai 3, o que bloqueia o CI do mesmo jeito. Mesmo
          # padrão do passo do bats: uma tentativa curta no apt e queda para o registry do npm.
          command -v rg >/dev/null 2>&1 && { rg --version | head -1; exit 0; }
          if timeout 90 sudo apt-get update -qq && timeout 60 sudo apt-get install -y -qq ripgrep; then
            rg --version | head -1 && exit 0
          fi
          echo "apt indisponível — instalando ripgrep pelo npm (@vscode/ripgrep)"
          npm install -g @vscode/ripgrep && echo "$(npm root -g)/@vscode/ripgrep/bin" >> "$GITHUB_PATH" \
            && "$(npm root -g)/@vscode/ripgrep/bin/rg" --version | head -1
      - name: Install pyyaml (frontmatter contract test)
        run: python3 -m pip install --user pyyaml || pip3 install --user pyyaml
      - name: Install dev deps (ajv for schema parity)
        run: npm ci || npm install
      - name: Run gate suite (shard)
        run: bash tests/run-all.sh --shard ${{ matrix.shard }}/3

  # Lints estáticos e Red-first: job próprio, em paralelo com os shards, para não alongar o shard
  # mais pesado nem depender de `if: matrix.shard == 1` (passo condicional é o primeiro passo para
  # passo opcional). Medidos em 2026-10-03: os quatro somam ~3s; o custo do job é o setup do runner.
  # O ambiente é o MESMO dos shards (bats, ripgrep, pyyaml, npm ci) porque o Red-first replay
  # executa o teste declarado de cada change bugfix, e esse teste pode precisar de qualquer um deles.
  estaticos:
    name: lints estáticos e red-first
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 — o Red-first replay deriva a árvore pré-correção do histórico (ver o job suite).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install bats (mesmo passo do job suite)
        timeout-minutes: 8
        run: |
          set -uo pipefail
          if timeout 90 sudo apt-get update -qq && timeout 60 sudo apt-get install -y -qq bats; then
            bats --version && exit 0
          fi
          echo "apt indisponível — instalando bats pelo npm"
          npm install -g bats && bats --version
      - name: Install ripgrep (mesmo passo do job suite)
        timeout-minutes: 8
        run: |
          set -uo pipefail
          command -v rg >/dev/null 2>&1 && { rg --version | head -1; exit 0; }
          if timeout 90 sudo apt-get update -qq && timeout 60 sudo apt-get install -y -qq ripgrep; then
            rg --version | head -1 && exit 0
          fi
          echo "apt indisponível — instalando ripgrep pelo npm (@vscode/ripgrep)"
          npm install -g @vscode/ripgrep && echo "$(npm root -g)/@vscode/ripgrep/bin" >> "$GITHUB_PATH" \
            && "$(npm root -g)/@vscode/ripgrep/bin/rg" --version | head -1
      - name: Install pyyaml
        run: python3 -m pip install --user pyyaml || pip3 install --user pyyaml
      - name: Install dev deps
        run: npm ci || npm install

      # Segredo hardcoded em arquivo versionado (issue #37, rule conventions/no-hardcoded-secrets.md).
      # No PR, sobre o DIFF: a pergunta ali é o que está ENTRANDO, e reprovar o autor pelo passivo
      # que ele não criou seria ruído. Num push para main/develop, sobre o repositório inteiro,
      # porque ali a pergunta é o passivo acumulado. Nos dois casos num runner que o autor do PR
      # não controla — o gate local é conveniência, este é autoridade.
      - name: Segredo em arquivo versionado (check-secrets)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FORGE_ROOT="$PWD" bash template/.forge/scripts/check-secrets.sh range "${{ github.event.pull_request.base.sha }}..HEAD"
          else
            FORGE_ROOT="$PWD" bash template/.forge/scripts/check-secrets.sh path "$PWD"
          fi

      # Instância 3 da issue #49: `<produtor> | grep -q … ||` sob pipefail vira linha pulada em
      # silêncio. Passo próprio, e não só dentro da suíte, porque o lint é da MAQUINARIA — quem
      # edita um script do harness precisa ver a reprovação no lugar mais visível do PR.
      - name: Lint de pipeline sob pipefail (check-shell-pipeline)
        run: FORGE_ROOT="$PWD" bash template/.forge/scripts/check-shell-pipeline.sh --path template --path tests

      # Instância 2 da issue #49: guarda que ninguém invoca conta como cobertura e não cobre nada.
      # Este passo prova que a rede de suítes está fiada nos pontos de entrada declarados — e o
      # próprio passo é um desses pontos de entrada.
      - name: Prova de invocação da rede de suítes (check-suite-wiring)
        run: FORGE_ROOT="$PWD" bash template/.forge/scripts/check-suite-wiring.sh --root "$PWD"

      # Red-first (LDG-0004): a execução que vale é esta, num runner que o autor do PR não
      # controla. Reexecuta o replay de todo change ativo type:bugfix e reprova o build se o Red
      # não for observado aqui — independentemente do que o artefato commitado afirme. Fecha o
      # vetor do ambiente controlado pelo autor; NÃO fecha o comando declarado arbitrário, o
      # defeito introduzido no próprio PR nem o waiver inverificável (ver a rule).
      - name: Red-first replay (autoridade do CI)
        run: FORGE_ROOT="$PWD" bash template/.forge/scripts/red-evidence.sh ci

  # Check obrigatório da branch protection: o nome `gates` é o que a proteção de main/develop exige,
  # e por isso este job agregador existe com exatamente esse nome. `if: always()` é essencial: sem
  # ele, um shard vermelho faria este job ser PULADO, e check pulado conta como aprovado na branch
  # protection — o PR entraria com a suíte reprovada. Por isso também a comparação é com `success`
  # (e não `!= failure`): `cancelled` e `skipped` de um shard reprovam aqui.
  gates:
    name: gates
    if: ${{ always() }}
    needs: [suite, estaticos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Todos os shards e os lints estáticos passaram
        run: |
          echo "suite (todos os shards): ${{ needs.suite.result }}"
          echo "estaticos: ${{ needs.estaticos.result }}"
          if [ "${{ needs.suite.result }}" != "success" ] || [ "${{ needs.estaticos.result }}" != "success" ]; then
            echo "FAIL gates — algum shard da suíte ou o job de lints estáticos não saiu success"
            exit 1
          fi
          echo "OK gates — todos os shards e os lints estáticos verdes"

# Spec delta — add-liaison-native-bridge (schema: template/.forge/schemas/spec-delta.schema.json).
# modify_requirement é SUBSTITUIÇÃO INTEGRAL — não se aplica aqui, pois todas as operações são
# add_requirement: a capability forge-harness-template não tinha nenhum destes requisitos.
# Numeração continua de REQ-FHT-053 (último do baseline em .forge/product/current/capabilities/
# forge-harness-template/spec.yaml). Payloads derivados de requirements.md (REQ-01..REQ-12) e dos
# respectivos critérios de aceite.
operations:
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-054
    content_ref: requirements.md#req-01
    requirement:
      id: REQ-FHT-054
      title: "liaison-ops.sh notify — ponteiro canônico para mensagem publicada"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-054-A
          given: "uma mensagem própria já publicada por um sync com push bem-sucedido"
          when: "o operador roda liaison-ops.sh notify <channel> <msg_id> --to <destino>"
          then: "imprime no stdout o ponteiro canônico (primeira linha liaison:<channel>/<msg_id>, seguida de thread_id, content_sha e subject) idênticos aos do log"
        - id: SCN-FHT-054-B
          given: "um msg_id inexistente, de peer, ou de mensagem própria ainda não publicada"
          when: "o operador roda notify sobre essa condição"
          then: "recusa com rc != 0 nomeando a condição que falhou (não existe / não é mensagem própria / não publicada, com o comando sync que falta)"
      contracts: []
      tests:
        - tests/liaison-notify-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-055
    content_ref: requirements.md#req-02
    requirement:
      id: REQ-FHT-055
      title: "send --via cross-session --native-ref — registro de mensagem nativa recebida"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-055-A
          given: "uma recepção nativa (cross-session-message) presente no transcript da sessão, identificada por fingerprint"
          when: "o operador roda send <channel> --via cross-session --native-ref <fingerprint> [--session <id>] --authored-by <repo-do-peer> ..."
          then: "localiza a mensagem pelo fingerprint, extrai from/from-name/from-mode, e grava no log próprio uma mensagem com trust untrusted-peer, via cross-session e o objeto cross_session com os cinco subcampos obrigatórios, sem flag de origem informada pelo operador"
        - id: SCN-FHT-055-B
          given: "fingerprint não encontrado no transcript, transcript ilegível ou sessão não identificável"
          when: "o operador roda o mesmo comando"
          then: "recusa com rc != 0, nada é gravado, e o leitor reporta instrumento quebrado nas mesmas condições do diagnóstico de cobertura (REQ-FHT-061)"
      contracts: []
      tests:
        - tests/liaison-cross-session-record-gate.sh
        - tests/liaison-envelope-parity-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-056
    content_ref: requirements.md#req-03
    requirement:
      id: REQ-FHT-056
      title: "Peer sem canal em comum ao registrar mensagem nativa: recusar e orientar (C1)"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-056-A
          given: "um --authored-by que não está em channels.<channel>.participants do liaison.yaml"
          when: "o operador tenta registrar a mensagem nativa recebida (REQ-FHT-055)"
          then: "recusa com rc != 0, sem gravar nada (liaison.yaml, log, blobs e cursor intactos por hash antes/depois), imprimindo os dois caminhos de resolução (incluir o peer no canal existente, ou abrir canal novo com ele)"
      contracts: []
      tests:
        - tests/liaison-cross-session-record-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-057
    content_ref: requirements.md#req-04
    requirement:
      id: REQ-FHT-057
      title: "Gancho de saída SendMessage: varredura de segredo"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-057-A
          given: "um SendMessage com texto para destino de sessão cujo corpo (ou outro campo string de tool_input) casa um padrão de secret-scan.mjs"
          when: "o gancho PreToolUse guard-cross-session-send.sh roda"
          then: "bloqueia com exit 2, nomeando o padrão e nunca ecoando o trecho que casou, usando a mesma função de varredura do send"
      contracts: []
      tests:
        - tests/native-send-guard-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-058
    content_ref: requirements.md#req-05
    requirement:
      id: REQ-FHT-058
      title: "Escopo do gancho de saída: só aplica REQ-04/06/07 a destino de sessão"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-058-A
          given: "um SendMessage endereçando um subagente provado interno, ou o main da própria sessão"
          when: "o gancho de saída roda"
          then: "deixa passar com exit 0, sem aplicar varredura de segredo, destino declarado ou contenção"
        - id: SCN-FHT-058-B
          given: "um SendMessage endereçando destino de sessão (nome resolvido com unicidade local, ou endereço uds:)"
          when: "o gancho de saída roda"
          then: "aplica varredura de segredo (REQ-FHT-057), destino declarado (REQ-FHT-059) e contenção por workspace (REQ-FHT-060); destino ambíguo ou não classificável é tratado como destino de sessão (fail-closed) com mensagem explicando o motivo"
      contracts: []
      tests:
        - tests/native-send-guard-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-059
    content_ref: requirements.md#req-06
    requirement:
      id: REQ-FHT-059
      title: "Destino declarado em toda mensagem nativa que sai para sessão (C2)"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-059-A
          given: "um SendMessage com texto para destino de sessão"
          when: "o corpo não carrega, na primeira linha não vazia, um ponteiro liaison:<channel>/<msg_id> válido nem uma declaração ephemeral: <class> de classe efêmera válida"
          then: "bloqueia com exit 2 explicando as duas formas de declarar"
        - id: SCN-FHT-059-B
          given: "uma declaração ephemeral: internal-coordination"
          when: "o destino está em repositório diferente da origem (git-common-dir distinto), mesmo que do mesmo workspace"
          then: "bloqueia com exit 2 explicando que conteúdo substantivo entre repositórios é material de liaison"
      contracts: []
      tests:
        - tests/native-send-guard-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-060
    content_ref: requirements.md#req-07
    requirement:
      id: REQ-FHT-060
      title: "Contenção por workspace com workspaces permitidos (C3)"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-060-A
          given: "um destino de sessão resolvido no registro local cujo workspace difere do workspace da origem, e sem entrada ativa correspondente em allowed_workspaces do repositório principal da origem"
          when: "o gancho de saída roda"
          then: "bloqueia com exit 2 nomeando as duas identidades, dizendo que liberar é decisão humana fora da sessão (REQ-FHT-063), sem imprimir comando pronto para copiar"
        - id: SCN-FHT-060-B
          given: "o mesmo cenário, mas com a identidade do workspace de destino cadastrada ativa em allowed_workspaces"
          when: "o gancho de saída roda"
          then: "deixa passar com exit 0"
      contracts: []
      tests:
        - tests/native-send-guard-gate.sh
        - tests/native-send-guard-perf-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-061
    content_ref: requirements.md#req-08
    requirement:
      id: REQ-FHT-061
      title: "Diagnóstico de cobertura das mensagens nativas recebidas"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-061-A
          given: "o fim de uma sessão (SessionEnd) com mensagens nativas recebidas sem destinação (sem registro no liaison com o mesmo fingerprint em cross_session, nem native dispose)"
          when: "o diagnóstico roda (SessionEnd, ou liaison-ops.sh native check [--session <id>])"
          then: "lista as recepções pendentes (sinalizando à parte as de outro workspace e as de workspace desconhecido), em modo aviso (rc 0 sempre), persiste o relatório fora do repositório e o exibe uma única vez no bloco do liaison do SessionStart seguinte do mesmo repositório"
        - id: SCN-FHT-061-B
          given: "um transcript real que contém a string literal cross-session-message mas do qual o parser extrai zero recepções, ou um transcript de controle com duas mensagens nativas"
          when: "o diagnóstico roda"
          then: "reporta instrumento quebrado no primeiro caso, e exatamente duas detecções no segundo (controle a cada execução, nunca nada pendente por instrumento silenciosamente cego)"
      contracts: []
      tests:
        - tests/native-coverage-gate.sh
        - tests/native-readers-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-062
    content_ref: requirements.md#req-09
    requirement:
      id: REQ-FHT-062
      title: "Normas escritas da mensageria nativa entre sessões"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-062-A
          given: "as rules liaison-protocol.md e liaison-untrusted-input.md do template"
          when: "o change é entregue"
          then: "trazem o critério de classes obrigatórias e das classes efêmeras (fonte única com EPHEMERAL_CLASSES, conferida por tests/native-rules-parity-gate.sh), a regra internal-coordination, a aplicação integral das regras de dado não confiável à mensagem nativa, a afirmação de from-name autodeclarado, a afirmação de allowed_workspaces como proteção contra liberação induzida (não fronteira), e a recomendação de configuração gerenciada do Claude Code para repositórios PCI; last_reviewed atualizado nas duas e ao menos três itens abertos no ledger do harness com origem neste change"
      contracts: []
      tests:
        - tests/native-rules-parity-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-063
    content_ref: requirements.md#req-12
    requirement:
      id: REQ-FHT-063
      title: "Cadastro de workspaces permitidos e detecção de mudanças de contenção"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-063-A
          given: "um terminal do operador humano fora de qualquer sessão do Claude Code"
          when: "o operador roda native allow <identidade> --reason \"<motivo>\" (ou native revoke/native pin)"
          then: "grava a entrada em allowed_workspaces de .forge/liaison/allowed-workspaces.json (validado por schema), com id/reason/granted_by/granted_at, e self_identity no primeiro cadastro; rodado de dentro de uma sessão de agente (qualquer marcador CLAUDECODE/CLAUDE_CODE_SESSION_ID/CLAUDE_PID), recusa com rc != 0 sem tocar o arquivo"
        - id: SCN-FHT-063-B
          given: "uma mudança de contenção (cadastro alterado, linha do gancho de SendMessage removida/trocada em hooks.manifest, gancho ausente da fiação quando o manifesto o declara armado, ou identidade do remote origin diferente de self_identity)"
          when: "ocorre um push, uma rodada de doctor, ou a preparação de PR (/forge:prepare-pr, /forge:ship)"
          then: "o detector único (native containment) sinaliza a mudança nos três pontos, sem bloquear o push, para decisão humana no merge"
      contracts: []
      tests:
        - tests/native-containment-gate.sh
        - tests/native-containment-wiring-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-064
    content_ref: requirements.md#req-10
    requirement:
      id: REQ-FHT-064
      title: "Empacotamento e propagação do gancho de saída da ponte nativa"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-064-A
          given: "o harness instalado ou atualizado num consumidor"
          when: "sync-adapters.mjs gera a fiação a partir de hooks.manifest.default (matcher ^SendMessage$, contrato stdin-json)"
          then: "uma instalação nova recebe o gancho guard-cross-session-send.sh armado; um consumidor de fixture com .claude/settings.json pré-existente recebe o gancho inativo e nomeado, sem desfiar os ganchos que já existia fiados quando o passo de armar documentado é seguido; plugin/forge/commands/liaison.md é igual à versão do template"
      contracts: []
      tests:
        - tests/native-hook-packaging-gate.sh
  - op: add_requirement
    capability: forge-harness-template
    requirement_id: REQ-FHT-065
    content_ref: requirements.md#req-11
    requirement:
      id: REQ-FHT-065
      title: "Documentação operacional da ponte nativa (/forge:liaison)"
      normative: SHALL
      scenarios:
        - id: SCN-FHT-065-A
          given: "os subcomandos novos (notify, native check/dispose/allow/revoke/pin/containment) e send --via cross-session"
          when: "o change é entregue"
          then: "/forge:liaison (template e plugin) documenta argument-hint com os subcomandos novos, e para cada um o bloco de protocolo mostra exatamente o conjunto de flags aceitas pelo script (conferido por teste); send cross-session mostra só --native-ref/--session, sem flag de origem; docs/refer/slash-commands.md descreve os subcomandos novos; CHANGELOG.md [Unreleased] traz o passo de armar do gancho; o badge de gates do README.md bate com a contagem real"
      contracts: []
      tests:
        - tests/native-docs-gate.sh
        - tests/w200-readme-inventory-gate.sh
        - tests/plugin-sync-gate.sh
